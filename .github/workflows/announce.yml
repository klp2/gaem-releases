name: release announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      approved_message_sha256:
        description: SHA-256 of the exact probe message approved in chat
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One CAS branch serializes every delivery. The expected-head mutation still
  # protects against manual/external writers and ambiguous API responses.
  group: discord-announcement-state
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # expected-head commits on announcement-state only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and validate the fresh delivery plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          APPROVED_MESSAGE_SHA256: ${{ inputs.approved_message_sha256 }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          case "$GITHUB_EVENT_NAME" in
            release)
              live="$RUNNER_TEMP/release.json"
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$live"
              go run ./cmd/announce plan "$GITHUB_EVENT_PATH" "$live" "$plan"
              state_path="announcements/v1/$RELEASE_ID.json"
              delivery_label="announcement-$RELEASE_ID"
              ;;
            workflow_dispatch)
              state_path="probes/v1/discord-announcement.json"
              probe_delivery_id="$GITHUB_RUN_ID"
              scripts/announcement-state.sh read "$GITHUB_REPOSITORY" \
                announcement-state "$state_path" "$RUNNER_TEMP/probe-head.txt" \
                "$RUNNER_TEMP/probe-state.json"
              if [ -s "$RUNNER_TEMP/probe-state.json" ]; then
                probe_delivery_id="$(jq -er \
                  '.delivery_id | select(type == "number" and . > 0) | tostring' \
                  "$RUNNER_TEMP/probe-state.json")"
              fi
              go run ./cmd/announce probe-plan "$probe_delivery_id" \
                "$APPROVED_MESSAGE_SHA256" "$plan"
              delivery_label="rollout-probe"
              ;;
            *)
              echo "FATAL: unsupported delivery event." >&2
              exit 1
              ;;
          esac
          action="$(jq -er .action "$plan")"
          reason="$(jq -er .reason "$plan")"
          {
            echo "action=$action"
            echo "reason=$reason"
            echo "state_path=$state_path"
            echo "delivery_label=$delivery_label"
          } >>"$GITHUB_OUTPUT"
          jq -rj '.body // ""' "$plan" >"$RUNNER_TEMP/delivery-body.txt"
          jq -rj '.message // ""' "$plan" >"$RUNNER_TEMP/message.txt"

      - name: Report a filtered delivery
        if: steps.plan.outputs.action == 'skip'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "Delivery skipped — $REASON."

      - name: Inspect external idempotency state
        if: steps.plan.outputs.action == 'announce'
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_PATH: ${{ steps.plan.outputs.state_path }}
        run: |
          set -euo pipefail
          scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
            "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
          go run ./cmd/announce state-plan "$RUNNER_TEMP/plan.json" \
            "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/state-plan.json"
          action="$(jq -er .action "$RUNNER_TEMP/state-plan.json")"
          reason="$(jq -er .reason "$RUNNER_TEMP/state-plan.json")"
          if [ "$action" = fail ]; then
            echo "FATAL: $reason" >&2
            exit 1
          fi
          {
            echo "action=$action"
            echo "reason=$reason"
          } >>"$GITHUB_OUTPUT"

      - name: Report an idempotent skip
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'skip'
        env:
          REASON: ${{ steps.state.outputs.reason }}
        run: echo "Delivery skipped — $REASON."

      - name: Verify announcements webhook channel
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: scripts/discord-webhook.sh check

      - name: Reserve this delivery attempt
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          APPROVED_MESSAGE_SHA256: ${{ inputs.approved_message_sha256 }}
          STATE_PATH: ${{ steps.plan.outputs.state_path }}
          DELIVERY_LABEL: ${{ steps.plan.outputs.delivery_label }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          reserved="$RUNNER_TEMP/reserved-state.json"
          committed=false
          for try in 1 2 3; do
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            if cmp --silent "$reserved" "$RUNNER_TEMP/state.json" 2>/dev/null; then
              committed=true
              break
            fi
            go run ./cmd/announce reserve "$RUNNER_TEMP/plan.json" \
              "$RUNNER_TEMP/state.json" "$ATTEMPT" "$reserved"
            head="$(cat "$RUNNER_TEMP/state-head.txt")"
            if scripts/announcement-state.sh cas "$GITHUB_REPOSITORY" announcement-state \
              "$STATE_PATH" "$head" "$reserved" \
              "ci: reserve Discord $DELIVERY_LABEL" "$RUNNER_TEMP/state-commit.txt"; then
              committed=true
              break
            fi
            echo "CAS contention while reserving (attempt $try of 3); replanning." >&2
          done
          if [ "$committed" != true ]; then
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            cmp --silent "$reserved" "$RUNNER_TEMP/state.json" || {
              echo "FATAL: reservation CAS did not converge; refusing to send." >&2
              exit 1
            }
          fi

          case "$GITHUB_EVENT_NAME" in
            release)
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                >"$RUNNER_TEMP/pre-send-release.json"
              go run ./cmd/announce plan "$GITHUB_EVENT_PATH" \
                "$RUNNER_TEMP/pre-send-release.json" "$RUNNER_TEMP/pre-send-plan.json"
              ;;
            workflow_dispatch)
              probe_delivery_id="$(jq -er '.delivery_id | tostring' \
                "$RUNNER_TEMP/plan.json")"
              go run ./cmd/announce probe-plan "$probe_delivery_id" \
                "$APPROVED_MESSAGE_SHA256" "$RUNNER_TEMP/pre-send-plan.json"
              ;;
            *)
              echo "FATAL: unsupported delivery event before send." >&2
              exit 1
              ;;
          esac
          cmp --silent "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/pre-send-plan.json" || {
            echo "FATAL: delivery plan changed after reservation; refusing to POST." >&2
            exit 1
          }
          scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
            "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
          cmp --silent "$reserved" "$RUNNER_TEMP/state.json" || {
            echo "FATAL: reservation changed before send; refusing to POST." >&2
            exit 1
          }

      - name: Send and read back the approved message
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        id: discord
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          scripts/discord-webhook.sh send "$RUNNER_TEMP/message.txt" \
            "$RUNNER_TEMP/message-id.txt"
          echo "message_id=$(cat "$RUNNER_TEMP/message-id.txt")" >>"$GITHUB_OUTPUT"

      - name: Record and verify the Discord message id
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_PATH: ${{ steps.plan.outputs.state_path }}
          DELIVERY_LABEL: ${{ steps.plan.outputs.delivery_label }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
          MESSAGE_ID: ${{ steps.discord.outputs.message_id }}
        run: |
          set -euo pipefail
          complete="$RUNNER_TEMP/complete-state.json"
          committed=false
          for try in 1 2 3; do
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            if cmp --silent "$complete" "$RUNNER_TEMP/state.json" 2>/dev/null; then
              committed=true
              break
            fi
            go run ./cmd/announce complete "$RUNNER_TEMP/plan.json" \
              "$RUNNER_TEMP/state.json" "$ATTEMPT" "$MESSAGE_ID" "$complete"
            head="$(cat "$RUNNER_TEMP/state-head.txt")"
            if scripts/announcement-state.sh cas "$GITHUB_REPOSITORY" announcement-state \
              "$STATE_PATH" "$head" "$complete" \
              "ci: complete Discord $DELIVERY_LABEL" "$RUNNER_TEMP/state-commit.txt"; then
              committed=true
              break
            fi
            echo "CAS contention while completing (attempt $try of 3); replanning." >&2
          done
          if [ "$committed" != true ]; then
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            cmp --silent "$complete" "$RUNNER_TEMP/state.json" || {
              echo "FATAL: completion CAS did not converge; sent state needs recovery." >&2
              exit 1
            }
          fi

          scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
            "$STATE_PATH" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
          go run ./cmd/announce state-plan "$RUNNER_TEMP/plan.json" \
            "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/final-state-plan.json"
          jq -e --arg attempt "$ATTEMPT" --arg message_id "$MESSAGE_ID" \
            '.state == "sent" and .attempt == $attempt and .message_id == $message_id' \
            "$RUNNER_TEMP/state.json" >/dev/null || {
              echo "FATAL: final delivery state does not bind the sent message." >&2
              exit 1
            }
          echo "Sent state verified for Discord message $MESSAGE_ID."
