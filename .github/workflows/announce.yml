name: release announcement

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # One CAS branch serializes every release. The expected-head mutation still
  # protects against manual/external writers and ambiguous API responses.
  group: discord-announcement-state
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # expected-head commits on announcement-state only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate the fresh release and announcement
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/release.json"
          plan="$RUNNER_TEMP/plan.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$live"
          go run ./cmd/announce plan "$GITHUB_EVENT_PATH" "$live" "$plan"
          action="$(jq -er .action "$plan")"
          reason="$(jq -er .reason "$plan")"
          {
            echo "action=$action"
            echo "reason=$reason"
          } >>"$GITHUB_OUTPUT"
          jq -rj '.body // ""' "$plan" >"$RUNNER_TEMP/release-body.txt"
          jq -rj '.message // ""' "$plan" >"$RUNNER_TEMP/message.txt"

      - name: Report a filtered release
        if: steps.plan.outputs.action == 'skip'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "Announcement skipped — $REASON."

      - name: Inspect external idempotency state
        if: steps.plan.outputs.action == 'announce'
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          state_path="announcements/v1/$RELEASE_ID.json"
          scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
            "$state_path" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
          go run ./cmd/announce state-plan "$RUNNER_TEMP/plan.json" \
            "$RUNNER_TEMP/state.json" "$RUNNER_TEMP/state-plan.json"
          action="$(jq -er .action "$RUNNER_TEMP/state-plan.json")"
          reason="$(jq -er .reason "$RUNNER_TEMP/state-plan.json")"
          {
            echo "action=$action"
            echo "reason=$reason"
          } >>"$GITHUB_OUTPUT"

      - name: Report an idempotent skip
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'skip'
        env:
          REASON: ${{ steps.state.outputs.reason }}
        run: echo "Announcement skipped — $REASON."

      - name: Verify announcements webhook channel
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          set -euo pipefail
          [ -n "${DISCORD_ANNOUNCE_WEBHOOK:-}" ] || {
            echo "FATAL: DISCORD_ANNOUNCE_WEBHOOK is not provisioned." >&2
            exit 1
          }
          set +e
          status="$(curl --silent --output "$RUNNER_TEMP/webhook.json" \
            --write-out '%{http_code}' "$DISCORD_ANNOUNCE_WEBHOOK" \
            2>"$RUNNER_TEMP/webhook.err")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ] || [ "$status" != 200 ]; then
            echo "FATAL: announcements webhook identity check failed (details suppressed)." >&2
            exit 1
          fi
          jq -e '.channel_id == "1525952505593462995"' \
            "$RUNNER_TEMP/webhook.json" >/dev/null || {
            echo "FATAL: webhook does not target #announcements." >&2
            exit 1
          }

      - name: Reserve this send attempt
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          state_path="announcements/v1/$RELEASE_ID.json"
          reserved="$RUNNER_TEMP/reserved-state.json"
          committed=false
          for try in 1 2 3; do
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$state_path" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            if cmp --silent "$reserved" "$RUNNER_TEMP/state.json" 2>/dev/null; then
              committed=true
              break
            fi
            go run ./cmd/announce reserve "$RUNNER_TEMP/plan.json" \
              "$RUNNER_TEMP/state.json" "$ATTEMPT" "$reserved"
            head="$(cat "$RUNNER_TEMP/state-head.txt")"
            if scripts/announcement-state.sh cas "$GITHUB_REPOSITORY" announcement-state \
              "$state_path" "$head" "$reserved" \
              "ci: reserve Discord announcement $RELEASE_ID" "$RUNNER_TEMP/state-commit.txt"; then
              committed=true
              break
            fi
            echo "CAS contention while reserving (attempt $try of 3); replanning." >&2
          done
          if [ "$committed" != true ]; then
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$state_path" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            cmp --silent "$reserved" "$RUNNER_TEMP/state.json" || {
              echo "FATAL: reservation CAS did not converge; refusing to send." >&2
              exit 1
            }
          fi

          # The reservation binds the original body and message digests. A
          # final fresh release read must still reproduce that exact plan; the
          # workflow never overwrites a concurrent release edit.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            >"$RUNNER_TEMP/pre-send-release.json"
          go run ./cmd/announce plan "$GITHUB_EVENT_PATH" \
            "$RUNNER_TEMP/pre-send-release.json" "$RUNNER_TEMP/pre-send-plan.json"
          cmp --silent "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/pre-send-plan.json" || {
            echo "FATAL: release changed after reservation; retry remains locked." >&2
            exit 1
          }
          scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
            "$state_path" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
          cmp --silent "$reserved" "$RUNNER_TEMP/state.json" || {
            echo "FATAL: reservation changed before send; refusing to POST." >&2
            exit 1
          }

      - name: Send and read back the Discord message
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        id: discord
        env:
          DISCORD_ANNOUNCE_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
        run: |
          set -euo pipefail
          message="$RUNNER_TEMP/message.txt"
          jq -n --rawfile content "$message" \
            '{content:$content, allowed_mentions:{parse:[]}}' >"$RUNNER_TEMP/payload.json"
          set +e
          status="$(curl --silent --output "$RUNNER_TEMP/discord-response.json" \
            --write-out '%{http_code}' -H 'Content-Type: application/json' \
            --request POST --data-binary @"$RUNNER_TEMP/payload.json" \
            "${DISCORD_ANNOUNCE_WEBHOOK}?wait=true" 2>"$RUNNER_TEMP/discord-send.err")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ] || [ "$status" != 200 ]; then
            echo "FATAL: Discord announcement send failed (details suppressed; retry is locked)." >&2
            exit 1
          fi
          message_id="$(jq -er '.id | select(test("^[1-9][0-9]*$"))' \
            "$RUNNER_TEMP/discord-response.json")"
          set +e
          status="$(curl --silent --output "$RUNNER_TEMP/discord-readback.json" \
            --write-out '%{http_code}' \
            "${DISCORD_ANNOUNCE_WEBHOOK}/messages/$message_id" \
            2>"$RUNNER_TEMP/discord-readback.err")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ] || [ "$status" != 200 ]; then
            echo "FATAL: Discord announcement readback failed (details suppressed; retry is locked)." >&2
            exit 1
          fi
          jq -e --rawfile expected "$message" \
            '.channel_id == "1525952505593462995" and .content == $expected' \
            "$RUNNER_TEMP/discord-readback.json" >/dev/null || {
            echo "FATAL: Discord readback content or channel disagrees with the approved payload." >&2
            exit 1
          }
          if jq -r .content "$RUNNER_TEMP/discord-readback.json" | grep -Fq '```'; then
            echo "FATAL: Discord readback contains a code fence." >&2
            exit 1
          fi
          echo "message_id=$message_id" >>"$GITHUB_OUTPUT"

      - name: Record the Discord message id
        if: steps.plan.outputs.action == 'announce' && steps.state.outputs.action == 'reserve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}
          MESSAGE_ID: ${{ steps.discord.outputs.message_id }}
        run: |
          set -euo pipefail
          state_path="announcements/v1/$RELEASE_ID.json"
          complete="$RUNNER_TEMP/complete-state.json"
          committed=false
          for try in 1 2 3; do
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$state_path" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            if cmp --silent "$complete" "$RUNNER_TEMP/state.json" 2>/dev/null; then
              committed=true
              break
            fi
            go run ./cmd/announce complete "$RUNNER_TEMP/plan.json" \
              "$RUNNER_TEMP/state.json" "$ATTEMPT" "$MESSAGE_ID" "$complete"
            head="$(cat "$RUNNER_TEMP/state-head.txt")"
            if scripts/announcement-state.sh cas "$GITHUB_REPOSITORY" announcement-state \
              "$state_path" "$head" "$complete" \
              "ci: complete Discord announcement $RELEASE_ID" "$RUNNER_TEMP/state-commit.txt"; then
              committed=true
              break
            fi
            echo "CAS contention while completing (attempt $try of 3); replanning." >&2
          done
          if [ "$committed" != true ]; then
            scripts/announcement-state.sh read "$GITHUB_REPOSITORY" announcement-state \
              "$state_path" "$RUNNER_TEMP/state-head.txt" "$RUNNER_TEMP/state.json"
            cmp --silent "$complete" "$RUNNER_TEMP/state.json" || {
              echo "FATAL: completion CAS did not converge; sent state needs recovery." >&2
              exit 1
            }
          fi
